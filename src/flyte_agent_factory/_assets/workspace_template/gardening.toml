# The repositories and paths the weekly factory-gardening project may tend. Only the owner edits this file:
# the factory's scope gate rejects any patch that touches it. Gardening is opt-in: with no [[target]] (or
# without this file) the weekly gardening run is skipped.
#
# Add a target with a [[target]] table; `repo` is a repository URL or a key of the profile's [repo] table, or
# use path = "<project directory>" instead:
#
# [[target]]
# repo = "git@github.com:you/your-repo.git"
