[mypy]
python_version = 3.12
strict = True
explicit_package_bases = True
warn_unreachable = True
# Module patterns can only wildcard whole components, so `test_*` and `*_test` cannot be an
# override: such files outside a tests/ directory are left out instead.
exclude = ^(?!(.*/)?tests/)(.*/)?(test_[^/]*|[^/]*_test)\.py$

# Tests may define untyped helpers, so calling them is allowed too: exempting the definitions while
# flagging every call to them made the exemption meaningless (thousands of no-untyped-call findings).
[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False

[mypy-*.tests.*,conftest,*.conftest]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
